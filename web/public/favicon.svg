<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="core" x1="16" y1="9" x2="16" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#33c98e"/>
    </linearGradient>
    <radialGradient id="glow" cx="16" cy="16" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .tile { fill: #0c1320; }
      @media (prefers-color-scheme: light) {
        .tile { fill: #e7eef7; }
        .ring { stroke: #1f5fe0; }
        #core stop:first-child { stop-color: #1f5fe0; }
        #core stop:last-child { stop-color: #0e8f64; }
        #glow stop:first-child { stop-color: #1f5fe0; }
      }
    </style>
  </defs>
  <rect class="tile" width="32" height="32" rx="8"/>
  <circle cx="16" cy="16" r="11" fill="url(#glow)"/>
  <circle class="ring" cx="16" cy="16" r="10.15" fill="none" stroke="#4f8cff" stroke-width="1.15" opacity="0.42"/>
  <circle class="ring" cx="16" cy="16" r="7.05" fill="none" stroke="#4f8cff" stroke-width="1.9"/>
  <circle cx="16" cy="16" r="3.35" fill="url(#core)"/>
</svg>
